<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stake</title>
<meta name="description" content="Stake is a financial technology company." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0A0F1A;
    --ink-2: #0E1524;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #E8ECF3;
    --muted: #8592A8;
    --muted-dim: #5D6979;
    --brass: #C6A15B;
    --brass-soft: rgba(198, 161, 91, 0.55);

    --sans: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;

    --maxw: 1120px;
    --pad: clamp(24px, 5vw, 72px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient depth: a single soft glow, low opacity */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    width: 90vw;
    max-width: 900px;
    aspect-ratio: 1 / 1;
    transform: translateX(-50%);
    background: radial-gradient(circle at center, rgba(198, 161, 91, 0.07), transparent 62%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    width: 100%;
    max-width: var(--maxw);
    margin-inline: auto;
    padding-inline: var(--pad);
    position: relative;
    z-index: 1;
  }

  /* ---------- Header ---------- */
  header {
    border-bottom: 1px solid var(--line);
    padding-block: 22px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }

  .status {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 0 var(--brass-soft);
    animation: pulse 3.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198, 161, 91, 0.45); }
    50% { box-shadow: 0 0 0 5px rgba(198, 161, 91, 0); }
  }

  /* ---------- Main ---------- */
  main {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    padding-block: clamp(72px, 16vh, 180px);
  }

  h1 {
    font-size: clamp(38px, 6.4vw, 76px);
    font-weight: 500;
    line-height: 1.04;
    letter-spacing: -0.02em;
    max-width: 15ch;
    color: var(--text);
  }

  .lede {
    margin-top: 30px;
    font-size: clamp(16px, 1.7vw, 19px);
    font-weight: 300;
    color: var(--muted);
    max-width: 52ch;
    line-height: 1.65;
  }

  /* Signature: a hairline that draws in on load */
  .rule {
    height: 1px;
    background: linear-gradient(to right, var(--brass-soft), var(--line));
    margin-block: clamp(44px, 7vh, 72px) clamp(28px, 4vh, 44px);
    transform-origin: left center;
    transform: scaleX(0);
    animation: draw 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
  }

  @keyframes draw { to { transform: scaleX(1); } }

  .contact-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-dim);
    margin-bottom: 14px;
  }

  .contact-link {
    display: inline-block;
    font-size: clamp(22px, 3.2vw, 32px);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
    position: relative;
    padding-bottom: 4px;
  }

  .contact-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: var(--line-strong);
    transform: scaleX(1);
    transform-origin: right center;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), background 0.4s ease;
  }

  .contact-link:hover::after,
  .contact-link:focus-visible::after {
    background: var(--brass);
    transform: scaleX(1);
  }

  .contact-link:focus-visible {
    outline: 2px solid var(--brass-soft);
    outline-offset: 6px;
    border-radius: 2px;
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    padding-block: 22px;
    flex-shrink: 0;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted-dim);
  }

  /* Entry animation for the hero block */
  .fade {
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .fade.d1 { animation-delay: 0.05s; }
  .fade.d2 { animation-delay: 0.15s; }
  .fade.d3 { animation-delay: 0.45s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px) {
    .footer-row { flex-direction: column; align-items: flex-start; gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .rule { transform: scaleX(1); }
    .fade { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap header-row">
      <span class="brand">Stake</span>
      <!-- <span class="status"><span class="dot" aria-hidden="true"></span>In development</span> -->
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1 class="fade d1">We build infrastructure for financial markets.</h1>
      <p class="lede fade d2">A focused team working on the systems behind the next generation of markets. We will share more when the time is right.</p>

      <div class="rule" aria-hidden="true"></div>

      <div class="fade d3">
        <p class="contact-label">Get in touch</p>
        <a class="contact-link" href="mailto:hello@stakehq.xyz">hello@stakehq.xyz</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-row">
      <span>&copy; 2026 Stake</span>
      <span>stakehq.xyz</span>
    </div>
  </footer>
</body>
</html>
